<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>پلتفرم خدمات حقوقی</title>
<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Tahoma,sans-serif;
background:#f4f6f9;
color:#102a43;
}
header{
background:#102a43;
color:white;
padding:30px 15px;
text-align:center;
}
main{
max-width:600px;
margin:auto;
padding:20px;
}
button{
display:block;
width:100%;
padding:18px;
margin:12px 0;
background:white;
color:#102a43;
border:1px solid #ddd;
border-radius:12px;
font-size:16px;
cursor:pointer;
}
button:hover{
background:#e6eef5;
}
footer{
text-align:center;
padding:20px;
color:#777;
}
</style>
</head>
<body>

<header>
<h1>⚖ پلتفرم خدمات حقوقی</h1>
<p>دسترسی آسان به خدمات حقوقی</p>
</header>

<main>
<button onclick="alert('به بخش مشاوره حقوقی آنلاین خوش آمدید')">مشاوره حقوقی آنلاین</button>
<button>جستجو و انتخاب وکیل</button>
<button>درخواست وکالت پرونده</button>
<button>تنظیم دادخواست و شکواییه</button>
<button>دستیار هوشمند حقوقی</button>
<button>پیگیری پرونده</button>
<button>ورود و ثبت‌نام کاربران</button>
<button>پنل اختصاصی وکلا</button>
</main>

<footer>
تمام حقوق محفوظ است.
</footer>

</body>
</html>
